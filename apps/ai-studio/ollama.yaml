# 1. Namespace: We will isolate your AI apps in their own namespace
apiVersion: v1
kind: Namespace
metadata:
  name: ai-studio
---
# 2. Persistent Storage: This ensures your downloaded AI models aren't lost if the server restarts
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ollama-pvc
  namespace: ai-studio
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
---
# 3. Deployment: The actual Ollama container (CPU-only configuration)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  namespace: ai-studio
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ollama
  template:
    metadata:
      labels:
        app: ollama
    spec:
      containers:
      - name: ollama
        image: ollama/ollama:latest
        ports:
        - containerPort: 11434
        volumeMounts:
        - name: ollama-storage
          mountPath: /root/.ollama
      volumes:
      - name: ollama-storage
        persistentVolumeClaim:
          claimName: ollama-pvc
---
# 4. Service: The internal network connection for Ollama
apiVersion: v1
kind: Service
metadata:
  name: ollama-service
  namespace: ai-studio
spec:
  type: ClusterIP
  selector:
    app: ollama
  ports:
  - port: 11434
    targetPort: 11434
